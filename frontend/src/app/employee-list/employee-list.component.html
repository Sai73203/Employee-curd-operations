<br>

<div class="container text-center mt-4">
  <table class="table table-striped table-bordered table-hover">
    
    <thead class="table-success">
      <tr>
        <th>Employee Id</th>
        <th>Employee Name</th>
        <th>Technology</th>
        <th>Employee Salary</th>
        <th colspan="2">Action</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let emp of employees">
        <td>{{ emp.id }}</td>
        <td>{{ emp.name }}</td>
        <td>{{ emp.tech }}</td>
        <td>{{ emp.salary }}</td>

        <td>
          <button class="btn btn-warning" (click)="updateEmployeeById(emp.id)">Update</button>
        </td>

        <td>
          <button class="btn btn-danger" (click)="deleteEmployeeById(emp.id)">Delete</button>
        </td>
        
      </tr>
    
    </tbody>

  </table>
</div>
